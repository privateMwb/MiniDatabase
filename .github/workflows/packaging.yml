# ============================================================
# .github/workflows/packaging.yml
# Verifies the Conan recipe and vcpkg port actually build and are
# consumable, on a real Linux runner (none of PACKAGING.md's Termux
# workarounds apply here -- this is what a real consumer experiences).
#
# Consumer verification is delegated to recipes/falconhttp/all/test_package/
# and vcpkg-smoke-test/ rather than reimplemented here, so there's one
# place -- not two -- that defines what "the package works" means.
#
# Unlike the leaf libraries (VectorPro, JsonPro, ...), MiniDatabase's own
# recipe/port declares all 7 of them as dependencies. This workflow
# doesn't need to know that -- conan create / vcpkg both resolve MiniDatabase's
# declared requirements automatically -- but it does mean a failure here
# can originate from a dependency's package, not just MiniDatabase's own recipe.
# ============================================================

name: Packaging

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "packaging/recipes/**"
      - "packaging/vcpkg/ports/**"
      - "packaging/vcpkg-smoke-test/**"
      - "CMakeLists.txt"
      - "conandata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------
  # conan create builds the package, then automatically builds and
  # runs recipes/falconhttp/all/test_package/ against it.
  # ------------------------------------------------------------
  conan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install Conan
        # Real hash-pinning, not just a version pin: every package conan
        # actually pulls in transitively (requests, PyYAML, Jinja2, ...)
        # is pinned by sha256 too, generated for real via `pip-compile
        # --generate-hashes` against PyPI (not hand-written - conan's
        # transitive dependency tree has 14 entries, too easy to get
        # wrong by hand) and verified to actually install clean with
        # `pip install --require-hashes` before being committed here.
        # To bump the conan version: edit packaging/requirements-conan.in,
        # then regenerate with:
        #   pip-compile --generate-hashes \
        #     --output-file=packaging/requirements-conan.txt \
        #     packaging/requirements-conan.in
        run: pip install --require-hashes -r packaging/requirements-conan.txt

      - name: Detect default profile
        run: conan profile detect --force

      - name: Resolve package version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: conan create (builds package + runs test_package)
        run: |
          conan create packaging/recipes/falconhttp/all --version ${{ steps.version.outputs.version }} \
            -s compiler.cppstd=23 --build=missing

  # ------------------------------------------------------------
  # Bootstrap vcpkg, then build vcpkg-smoke-test/ -- its manifest
  # (vcpkg.json + vcpkg-configuration.json's overlay-ports) installs
  # the port automatically during cmake configure.
  # ------------------------------------------------------------
  vcpkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure and build the smoke test
        working-directory: packaging/vcpkg-smoke-test
        run: |
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=/tmp/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build

      - name: Show MiniDatabase build logs
        if: failure()
        run: |
          echo "===== OUT ====="
          cat /tmp/vcpkg/buildtrees/falconhttp/install-x64-linux-dbg-out.log
          echo "===== ERR ====="
          cat /tmp/vcpkg/buildtrees/falconhttp/install-x64-linux-dbg-err.log

      - name: Run the smoke test
        working-directory: packaging/vcpkg-smoke-test
        run: ./build/smoke_test