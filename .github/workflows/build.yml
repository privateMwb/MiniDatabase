# ============================================================
# .github/workflows/build.yml
# Builds and runs the test suite across a matrix of OS,
# compiler, and build-type combinations.
# ============================================================

name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: "${{ matrix.os }} | ${{ matrix.compiler }} | ${{ matrix.build_type }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            compiler: GCC
            cxx: g++
            build_type: Debug

          - os: ubuntu-latest
            compiler: GCC
            cxx: g++
            build_type: Release

          - os: ubuntu-latest
            compiler: Clang
            cxx: clang++
            build_type: Debug

          - os: ubuntu-latest
            compiler: Clang
            cxx: clang++
            build_type: Release

          - os: windows-latest
            compiler: MSVC
            build_type: Debug

          - os: windows-latest
            compiler: MSVC
            build_type: Release

          - os: macos-latest
            compiler: AppleClang
            cxx: clang++
            build_type: Debug

          - os: macos-latest
            compiler: AppleClang
            cxx: clang++
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build g++ clang

      # GoogleTest is fetched by tests/google/CMakeLists.txt via
      # FetchContent at configure time - cached per matrix leg (OS +
      # compiler + build type all affect the resulting binary, so a
      # cache hit on one leg must never be reused by another) to avoid
      # a fresh clang++-and-cmake-built GoogleTest on every one of the
      # 8 legs below, every run.
      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-${{ matrix.compiler }}-${{ matrix.build_type }}/_deps
          key: deps-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('tests/google/CMakeLists.txt') }}

      # tests/ is the only thing this workflow exercises (via ctest
      # below) - both tests/custom (one aggregate CTest entry, added
      # via add_test()) and tests/google (one CTest entry per TEST(),
      # discovered via gtest_discover_tests()) ride on the same
      # BUILD_TESTS default (ON) and don't need separate build/run
      # steps from each other, unlike benchmark.yml's custom/google
      # split, which does. Benchmarks, regression, and examples are
      # disabled here to reduce CI time.
      - name: Configure
        env:
          CXX: ${{ matrix.cxx || '' }}
        run: cmake -S . -B build-${{ matrix.compiler }}-${{ matrix.build_type }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_BENCHMARKS=OFF -DBUILD_REGRESSION=OFF -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build-${{ matrix.compiler }}-${{ matrix.build_type }} --config ${{ matrix.build_type }}

      - name: Run tests
        run: ctest --test-dir build-${{ matrix.compiler }}-${{ matrix.build_type }} -C ${{ matrix.build_type }} --output-on-failure