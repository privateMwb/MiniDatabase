# ============================================================
# .github/workflows/sanitizers.yml
# Builds and runs the test suite under ASan/UBSan, and separately
# under TSan, on every push and pull request.
#
# TSan is a separate job rather than a third flag alongside
# -fsanitize=address,undefined: ASan and TSan instrument memory access
# in mutually exclusive, incompatible ways and cannot share a build.
# TSan is the one that actually matters most for this project --
# Concurrency.cpp drives a real thread pool across parallel
# save/load/rebuildIndex/export -- so it's not just included for
# completeness.
# ============================================================

name: Sanitizers

on:
  push:
  pull_request:

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake clang

      # Benchmarks/regression/examples are skipped: instrumenting a
      # fetched third-party dependency (benchmarks/ pulls in
      # nlohmann_json) with sanitizer flags wastes build time and
      # surfaces warnings this repo can't fix.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_REGRESSION=OFF \
            -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  tsan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake clang

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_REGRESSION=OFF \
            -DBUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      # TSAN_OPTIONS: report a nonzero exit code on any detected race so
      # CI actually fails on one, rather than just printing a warning.
      - name: Run tests
        env:
          TSAN_OPTIONS: "halt_on_error=1"
        run: ctest --test-dir build --output-on-failure