<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MiniDatabase" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1130"/>
      <stop offset="100%" stop-color="#070B18"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B7FD0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141C3A" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#070B18" stop-opacity="0"/>
      <stop offset="100%" stop-color="#070B18" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#fade)"/>

  <g transform="translate(136,116)" fill="none" stroke="#06B6D4" stroke-width="1.6" opacity="0.65" stroke-linecap="round">
    <ellipse cx="14" cy="6" rx="12" ry="5"/>
    <path d="M2 6 V28 A12 5 0 0 0 26 28 V6"/>
    <path d="M2 17 A12 5 0 0 0 26 17"/>
  </g>
  <g transform="translate(1036,116)" fill="none" stroke="#EC4899" stroke-width="1.6" opacity="0.65" stroke-linecap="round">
    <ellipse cx="14" cy="6" rx="12" ry="5"/>
    <path d="M2 6 V28 A12 5 0 0 0 26 28 V6"/>
    <path d="M2 17 A12 5 0 0 0 26 17"/>
  </g>

  <text x="600" y="155" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="4"
        fill="url(#titleGradient)" filter="url(#glow)">MiniDatabase</text>

  <rect x="400" y="185" width="400" height="2" fill="url(#lineGradient)"/>

  <text x="600" y="220" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="18" letter-spacing="2" fill="#8FA4C0">EMBEDDED, IN-PROCESS DATABASE ENGINE FOR C++23</text>
</svg>
